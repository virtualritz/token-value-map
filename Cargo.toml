[package]
name = "token-value-map"
version = "0.2.5"
authors = ["Moritz Moeller <virtualritz@gmail.com>"]
edition = "2024"
keywords = ["graphics", "animation", "attribute", "keyframe", "dcc"]
categories = ["graphics"]
license = "Apache-2.0 OR BSD-3-Clause OR MIT OR Zlib"
description = "A token-value map with interpolation of values: what you need for DCCs"
exclude = [".github/**/*"]
readme = "README.md"
documentation = "https://docs.rs/token-value-map"
repository = "https://github.com/virtualritz/token-value-map/"

[features]
default = ["builtin-types", "2d", "vec_variants", "glam", "ustr", "curves"]
builtin-types = []
# Curve types (RealCurve, ColorCurve, Position) for parameter mappings.
curves = ["builtin-types"]
lua = ["dep:mlua"]
ustr = ["dep:ustr"]
serde = ["dep:serde", "ustr?/serde", "mitsein/serde"]

# Math backend features (mutually exclusive).
glam = ["dep:glam"]
nalgebra = ["dep:nalgebra"]
ultraviolet = ["dep:ultraviolet"]

# mint interop -- enables From/Into<mint::*> on wrapper types.
# Weak deps auto-forward mint to whichever backend is active.
mint = ["dep:mint", "glam?/mint", "nalgebra?/convert-mint", "ultraviolet?/mint"]

# rkyv only works with glam backend.
# `KeyDataMap` gets manual rkyv impls that delegate to `BTreeMap`, so no
# `mitsein/rkyv` forwarding is needed -- published mitsein 0.9 suffices.
rkyv = ["dep:rkyv", "glam", "frame-tick/rkyv", "frame-tick/bytecheck", "glam/rkyv"]
# Standalone bytecheck for frame-tick (also pulled in by rkyv).
bytecheck = ["dep:rkyv", "frame-tick/bytecheck"]

# Facet support -- works with any backend.
facet = ["dep:facet", "frame-tick/facet"]

egui-keyframe = ["dep:egui-keyframe"]
interpolation = ["dep:uniform-cubic-splines"]
dopamine-compat = ["interpolation"]

# Individual type features.
vector2 = []
vector3 = []
matrix3 = []
normal3 = []
point3 = []
matrix4 = []
vec_variants = []

# Global feature flags.
2d = ["vector2", "matrix3"]
3d = ["vector3", "matrix4", "normal3", "point3"]

[dependencies]
bytemuck = "1"
derive_more = { version = "2", features = ["as_ref"] }
egui-keyframe = { version = "0.1", optional = true }
enum_dispatch = "0.3"
facet = { version = "0.46", optional = true }
frame-tick = { version = "0.3", features = [
    "float_frame_rate",
    "serde",
    "std",
] }
function_name = "0.3"
glam = { version = "0.33", optional = true, features = ["serde", "bytemuck"] }
log = "0.4"
mint = { version = "0.5", optional = true }
mitsein = { version = "0.9", default-features = false, features = [
    "std",
    "rayon",
] }
mlua = { version = "0.12", features = ["anyhow", "lua53"], optional = true }
nalgebra = { version = "0.35", optional = true, features = [
    "bytemuck",
    "serde-serialize",
] }
rayon = "1"
rkyv = { version = "0.8", features = ["bytecheck"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
smallvec = { version = "1", features = ["const_generics", "const_new"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
ultraviolet = { version = "0.10", optional = true, features = [
    "bytemuck",
    "serde",
    "f64",
] }
uniform-cubic-splines = { version = "0.5", optional = true }
ustr = { version = "1", optional = true }

[dev-dependencies]
anyhow = "1"
facet-json = "0.46"

